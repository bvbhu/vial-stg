name: Release artifacts (build only)

# 只构建，不发布。
#
# 上游 vial-kb/vial-gui 没有自动发布 release —— 它只有 main.yml / test.yml 两个
# workflow，产物一律作为 workflow artifact 留存，从不创建 GitHub Release。
# 本仓库同样只构建：在 Actions run 的 Artifacts 页下载，手动上传到 Release。
#
# 产物名沿用「<应用名>-v<版本>-<平台>」的形态，应用名取自
# vial-gui/src/build/settings/base.json 的 app_name（即 Vial-STG）：
#   Vial-STG-v<ver>-setup.exe          Windows 安装程序（NSIS）
#   Vial-STG-v<ver>-portable.zip       Windows 免安装版
#   Vial-STG-v<ver>-x86_64.AppImage    Linux x86_64
#   Vial-STG-v<ver>.dmg                macOS
#
# 打包链路沿用 vial-gui 上游自己的 CI 配方，应用名统一换成 Vial-STG。
# fbs / PyInstaller 官方只支持 Python 3.6（见 vial-gui/README.md），所以三个打包
# job 全部用 Python 3.6 + vial-gui/requirements.txt，不要换成新版 Python
# （PyInstaller 3.4 在 3.7+ 上装不上）。

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（不带 v 前缀），例如 0.7.5
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
    - id: v
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          ver="${{ inputs.version }}"
        else
          ver="${GITHUB_REF_NAME#v}"
        fi
        echo "version=$ver" >> "$GITHUB_OUTPUT"
        echo "==> Vial-STG-v$ver"

  win:
    runs-on: windows-2025
    needs: meta

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.6.x'

    - name: Setup venv
      working-directory: vial-gui
      run: |
        python -m venv venv
        . .\venv\Scripts\activate.ps1
        pip install -r requirements.txt

    - name: Install NSIS
      working-directory: vial-gui
      run: |
        Invoke-WebRequest "https://github.com/vial-kb/vial-deps/releases/download/v1/nsis-3.06.1-setup.exe" -UserAgent "wget" -OutFile nsis-setup.exe
        if ((Get-FileHash nsis-setup.exe -Algorithm sha256).Hash -ne "f60488a676308079bfdf6845dc7114cfd4bbff47b66be4db827b89bb8d7fdc52") { Write-Error 'SHA256 mismatch' }
        Start-Process -FilePath "nsis-setup.exe" -ArgumentList "/S", "/D=C:\Program Files (x86)\NSIS" -NoNewWindow -Wait

    - name: Install Visual C++ Redistributable
      working-directory: vial-gui
      shell: pwsh
      run: |
        # fbs 0.9.0 的 freeze/windows.py::_add_missing_dlls() 会依次要求这 7 个 DLL
        # 都能在 **PATH** 上找到（_find_on_path 遍历 PATH，不是只查 System32）：
        #     msvcr100.dll                                      <- VC++ 2010
        #     msvcr110.dll  msvcp110.dll                        <- VC++ 2012
        #     vcruntime140.dll msvcp140.dll concrt140.dll vccorlib140.dll  <- VC++ 2015+
        # 少任何一个都抛 FileNotFoundError，而它的文案**固定**写「请安装 VS 2012」，
        # 与实际缺哪套无关 —— 现场缺的其实是 msvcr100(2010)，照文案去装 2012 会白忙。
        # 所以这里按 DLL 逐个判定，缺哪套装哪套。
        #
        # 装法优先用 Chocolatey：GitHub 的 Windows 镜像自带 choco，包名长期维护，
        # 不必去猜 download.microsoft.com 的 /download/<GUID>/ 直链 —— 那种链接一旦
        # 失效会**返回 200 + HTML 错误页**（不是 404），Invoke-WebRequest 不报错，
        # HTML 被存成 .exe，直到 Start-Process 才炸（本步骤历史上正是这么挂的）。
        # 因此凡走直链的地方都先校验 PE 的 MZ 头，且把 choco 作为首选途径。
        $ErrorActionPreference = 'Stop'

        # 与 fbs 的 _find_on_path 同语义：逐段查 PATH。
        function Find-OnPath {
          param([string]$Name)
          foreach ($d in ($env:PATH -split [IO.Path]::PathSeparator)) {
            if ([string]::IsNullOrWhiteSpace($d)) { continue }
            $p = Join-Path $d $Name
            if (Test-Path -LiteralPath $p) { return $p }
          }
          return $null
        }

        $required = @(
          'msvcr100.dll',
          'msvcr110.dll', 'msvcp110.dll',
          'vcruntime140.dll', 'msvcp140.dll', 'concrt140.dll', 'vccorlib140.dll'
        )

        function Get-PeFile {
          param([string]$Name, [string]$Uri)
          $exe = Join-Path $env:TEMP "$Name.exe"
          Write-Host "  downloading $Name"
          Invoke-WebRequest -Uri $Uri -OutFile $exe -UseBasicParsing
          $fs = [System.IO.File]::OpenRead($exe)
          try {
            $sig = New-Object byte[] 2
            $null = $fs.Read($sig, 0, 2)
          } finally { $fs.Dispose() }
          if ($sig[0] -ne 0x4D -or $sig[1] -ne 0x5A) {
            throw "$Name is not a PE executable (no MZ header, $( (Get-Item $exe).Length ) bytes) " +
                  "-- the URL is dead; download.microsoft.com serves an HTML error page with " +
                  "HTTP 200 for retired /download/<GUID>/ paths."
          }
          return $exe
        }

        function Install-ViaChoco {
          param([string]$Package)
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) { return $false }
          Write-Host "  choco install $Package"
          choco install $Package -y --no-progress --limit-output | Out-Host
          # choco 在部分包里返回非 0 但实际已装好，故由调用方的 DLL 复查决定成败。
          return $true
        }

        # 每套运行库：先 choco（包名稳定），失败再退回官方直链。
        $suites = @(
          @{ name  = 'VC++ 2010 (msvcr100)'
             needs = @('msvcr100.dll')
             choco = 'vcredist2010'
             urls  = @(
               # 只用 aka.ms 短链；VS2010 无短链，故该套依赖 choco。
             ) }
          @{ name  = 'VC++ 2012 (msvcr110/msvcp110)'
             needs = @('msvcr110.dll', 'msvcp110.dll')
             choco = 'vcredist2012'
             urls  = @(
               @{ n = 'vcredist_2012_x86'; u = 'https://download.microsoft.com/download/1/6/B/16B06F60-3B20-4FF2-B699-5E9B7962F9AE/vcredist_x86.exe' },
               @{ n = 'vcredist_2012_x64'; u = 'https://download.microsoft.com/download/1/6/B/16B06F60-3B20-4FF2-B699-5E9B7962F9AE/vcredist_x64.exe' }
             ) }
          @{ name  = 'VC++ 2015-2022 (vcruntime140 系列)'
             needs = @('vcruntime140.dll', 'msvcp140.dll', 'concrt140.dll', 'vccorlib140.dll')
             choco = 'vcredist140'
             urls  = @(
               @{ n = 'vc_redist_x64'; u = 'https://aka.ms/vs/17/release/vc_redist.x64.exe' },
               @{ n = 'vc_redist_x86'; u = 'https://aka.ms/vs/17/release/vc_redist.x86.exe' }
             ) }
        )

        $notes = @()
        foreach ($s in $suites) {
          $missing = @($s.needs | Where-Object { -not (Find-OnPath $_) })
          if (-not $missing) {
            Write-Host "$($s.name): already on PATH"
            continue
          }
          Write-Host "$($s.name): missing $($missing -join ', ')"

          $ok = $false
          try { $ok = Install-ViaChoco -Package $s.choco } catch { $notes += "$($s.choco) (choco): $($_.Exception.Message)" }
          if ($ok -and -not @($s.needs | Where-Object { -not (Find-OnPath $_) })) {
            Write-Host "  -> satisfied via choco"
            continue
          }

          foreach ($r in $s.urls) {
            try {
              $exe = Get-PeFile -Name $r.n -Uri $r.u
              Start-Process -FilePath $exe -ArgumentList '/install', '/quiet', '/norestart' -Wait
              Remove-Item $exe -Force
            } catch {
              $notes += "$($r.n): $($_.Exception.Message)"
              Write-Host "  ! $($r.n): $($_.Exception.Message)"
            }
            if (-not @($s.needs | Where-Object { -not (Find-OnPath $_) })) { break }
          }
        }

        # 提前把缺口暴露出来，别等 fbs 用一句指向 VS2012 的误导文案报错。
        $still = @($required | Where-Object { -not (Find-OnPath $_) })
        if ($still) {
          Write-Host ('::error::missing on PATH: ' + ($still -join ', '))
          $notes | ForEach-Object { Write-Host "  - $_" }
          # 不用 here-string：本脚本嵌在 YAML 块标量里、每行都带缩进，
          # 而 here-string 结束符必须顶格，会被缩进破坏。
          throw ('fbs freeze will fail; these DLLs are not on PATH: ' + ($still -join ', ') +
                 '. fbs names VS 2012 in its message regardless of which suite is actually ' +
                 'missing. Install the matching redistributable, or vendor the DLL into the ' +
                 'freeze dir.')
        }
        Write-Host 'all Visual C++ runtimes required by fbs are available on PATH'

    - name: fbs freeze
      working-directory: vial-gui
      run: |
        . .\venv\Scripts\activate.ps1
        fbs freeze

    - name: fbs installer
      working-directory: vial-gui
      run: |
        $env:Path += ";C:\Program Files (x86)\NSIS"
        . .\venv\Scripts\activate.ps1
        fbs installer

    - name: Package
      working-directory: vial-gui
      run: |
        Copy-Item "target\Vial-STGSetup.exe" "Vial-STG-v${{ needs.meta.outputs.version }}-setup.exe"
        Compress-Archive -Path "target\Vial-STG" -DestinationPath "Vial-STG-v${{ needs.meta.outputs.version }}-portable.zip"
        Get-ChildItem Vial-STG-*

    - uses: actions/upload-artifact@v4
      with:
        name: win-setup
        path: vial-gui/Vial-STG-*-setup.exe
        if-no-files-found: error

    - uses: actions/upload-artifact@v4
      with:
        name: win-portable
        path: vial-gui/Vial-STG-*-portable.zip
        if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    needs: meta

    steps:
    - uses: actions/checkout@v4

    # 上游的 Linux 打包入口：docker build + docker run 跑 _builder.sh，
    # 里面是 fbs freeze / fbs installer / pkg2appimage misc/Vial-STG.yml
    - name: Build AppImage
      working-directory: vial-gui
      run: ./util/linux-builder/build-in-docker.sh

    - name: Package
      run: |
        cp vial-gui/util/linux-builder/output/Vial-STG-x86_64.AppImage "Vial-STG-v${{ needs.meta.outputs.version }}-x86_64.AppImage"
        ls -lah Vial-STG-*

    - uses: actions/upload-artifact@v4
      with:
        name: linux-appimage
        path: Vial-STG-*.AppImage
        if-no-files-found: error

  mac:
    runs-on: macos-15
    needs: meta
    env:
      PYTHON_VERSION: 3.6.8
      MACOSX_DEPLOYMENT_TARGET: 10.9

    steps:
    - uses: actions/checkout@v4

    - name: Get Python
      run: curl https://www.python.org/ftp/python/${PYTHON_VERSION}/python-${PYTHON_VERSION}-macosx${MACOSX_DEPLOYMENT_TARGET}.pkg -o "python.pkg"

    - name: Verify download
      run: shasum -a 256 -c <<< '4bcd53faffc98d193ef7cdccd5668de3829c702af4db45258819a84a2cab60d0 *python.pkg'

    - name: Install Python
      run: sudo installer -pkg python.pkg -target /

    - name: Setup venv
      working-directory: vial-gui
      run: |
        python3.6 -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt

    - name: fbs freeze
      working-directory: vial-gui
      run: |
        source venv/bin/activate
        fbs freeze

    - name: Create dmg
      working-directory: vial-gui
      run: hdiutil create -volname "Vial-STG" -srcfolder "target/Vial-STG.app" -ov -format UDZO "../Vial-STG-v${{ needs.meta.outputs.version }}.dmg"

    - uses: actions/upload-artifact@v4
      with:
        name: mac-dmg
        path: Vial-STG-*.dmg
        if-no-files-found: error

  # 把 4 个产物合并成一份，方便一次性下载后手动上传 release
  collect:
    runs-on: ubuntu-22.04
    needs: [meta, win, linux, mac]

    steps:
    - uses: actions/download-artifact@v4
      with:
        merge-multiple: true
        path: dist

    - name: List artifacts
      run: |
        echo "==== 待手动上传到 Release 的产物 ===="
        ls -lah dist
        test $(find dist -type f | wc -l) -eq 4 || { echo "期望 4 个产物，实际不是 4 个"; exit 1; }

    - uses: actions/upload-artifact@v4
      with:
        name: Vial-STG-v${{ needs.meta.outputs.version }}-dist
        path: dist
        if-no-files-found: error
